<html lang="en">

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"

  <title>Checkout — CANVO</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       CANVO CHECKOUT
    ===================================================== */

    :root {
      --navy: #07111f;
      --green: #3ca37d;
      --green-dark: #2e8f6c;
      --cream: #f4faf7;
      --white: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #d6dde5;
      --light: #eef3f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.5;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    /* =====================================================
       HEADER
    ===================================================== */

    .checkout-header {
      background: var(--white);
      border-bottom: 1px solid #e4e8eb;
      padding: 18px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .checkout-logo {
      text-decoration: none;
      color: var(--navy);
      font-family: "Playfair Display", serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .back-shop {
      text-decoration: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }

    .back-shop:hover {
      color: var(--green);
    }

    /* =====================================================
       MAIN
    ===================================================== */

    .checkout-wrap {
      width: 94%;
      max-width: 1500px;
      margin: 30px auto 60px;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      align-items: start;
    }

    .checkout-card {
      background: var(--white);
      border: 1px solid #dfe7e3;
      border-radius: 10px;
      padding: 40px 44px;
      box-shadow: 0 2px 8px rgba(20, 40, 30, 0.03);
    }

    .checkout-card h1,
    .checkout-card h2 {
      color: var(--navy);
    }

    .checkout-card h2 {
      font-size: 25px;
      margin-bottom: 20px;
    }

    /* =====================================================
       FORM
    ===================================================== */

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 7px;
      color: var(--text);
    }

    .required {
      color: #e63946;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {

      width: 100%;

      min-height: 48px;

      padding: 12px 14px;

      border: 1px solid var(--border);

      border-radius: 6px;

      background: #fff;

      color: var(--text);

      font-size: 15px;

      outline: none;

      transition: 0.2s;
    }

    .form-group textarea {
      min-height: 72px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(60, 163, 125, 0.08);
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: #98a2b3;
    }

    /* =====================================================
       ITEMS
    ===================================================== */

    .items-heading {
      margin-bottom: 15px;
    }

    .checkout-item {
      display: grid;

      grid-template-columns:
        78px
        1fr
        auto;

      gap: 14px;

      align-items: center;

      padding: 14px 0;

      border-bottom: 1px solid #e4e8eb;
    }

    .checkout-item-image {
      width: 72px;
      height: 72px;

      border-radius: 7px;

      background: #f1f3f2;

      overflow: hidden;
    }

    .checkout-item-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .checkout-item-name {
      font-size: 15px;
      font-weight: 600;

      margin-bottom: 5px;
    }

    .variant-text {
      font-size: 13px;
      color: var(--muted);

      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .variant-text span {
      background: #f2f5f4;
      padding: 3px 7px;
      border-radius: 4px;
    }

    .item-price {
      color: var(--green);
      font-size: 16px;
      font-weight: 700;
      margin-top: 7px;
    }

    /* =====================================================
       QUANTITY
    ===================================================== */

    .item-right {
      text-align: right;
      min-width: 130px;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 7px;
    }

    .quantity-control button {
      width: 38px;
      height: 38px;

      border: 1px solid #cfd8dc;

      background: #edf3f1;

      font-size: 21px;

      cursor: pointer;

      color: var(--navy);
    }

    .quantity-control button:first-child {
      border-radius: 7px 0 0 7px;
    }

    .quantity-control button:last-child {
      border-radius: 0 7px 7px 0;
    }

    .quantity-control span {
      width: 42px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #fff;

      border-top: 1px solid #cfd8dc;
      border-bottom: 1px solid #cfd8dc;

      font-size: 15px;
    }

    /* =====================================================
       ORDER SUMMARY
    ===================================================== */

    .summary {
      margin-top: 12px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 16px;

      padding: 5px 0;
    }

    .summary-total {
      border-top: 1px solid var(--navy);

      margin-top: 6px;
      padding-top: 9px;

      font-size: 21px;
      font-weight: 700;
    }

    /* =====================================================
       COUPON
    ===================================================== */

    .coupon-box {
      display: flex;
      margin-top: 15px;
    }

    .coupon-box input {
      flex: 1;

      height: 46px;

      border: 1px solid var(--green);

      border-right: none;

      border-radius: 6px 0 0 6px;

      padding: 0 14px;

      outline: none;

      font-size: 14px;
    }

    .coupon-box button {
      width: 95px;

      border: none;

      border-radius: 0 6px 6px 0;

      background: var(--green);

      color: white;

      font-size: 15px;

      cursor: pointer;
    }

    .coupon-box button:hover {
      background: var(--green-dark);
    }

    /* =====================================================
       PARTIAL PAYMENT
    ===================================================== */

    .partial-payment {
      margin-top: 22px;

      border: 1px dashed var(--green);

      background: #f3fbf8;

      padding: 15px;

      border-radius: 7px;
    }

    .partial-payment strong {
      display: block;

      font-size: 15px;

      margin-bottom: 9px;
    }

    .partial-input {
      position: relative;
    }

    .partial-input input {
      width: 100%;

      height: 42px;

      border: 1px solid #d2d9df;

      border-radius: 6px;

      padding: 0 42px 0 14px;

      font-size: 15px;

      outline: none;
    }

    .partial-input span {
      position: absolute;

      right: 12px;
      top: 50%;

      transform: translateY(-50%);

      color: var(--muted);
    }

    .payment-note {
      margin-top: 5px;

      color: var(--muted);

      font-size: 12px;
    }

    /* =====================================================
       PAYMENT
    ===================================================== */

    .payment-method {
      margin-top: 22px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }

    .payment-radio {
      display: flex;

      align-items: center;

      gap: 10px;

      font-size: 17px;
    }

    .payment-radio input {
      width: 20px;
      height: 20px;
      accent-color: #1683ff;
    }

    .payment-logos {
      display: flex;

      align-items: center;

      gap: 8px;

      flex-wrap: wrap;

      justify-content: flex-end;
    }

    .payment-logo {
      height: 30px;

      padding: 4px 8px;

      border-radius: 4px;

      background: white;

      border: 1px solid #e2e6e9;

      font-size: 11px;

      font-weight: 700;

      color: #344054;
    }

    .payment-logo.bkash {
      color: #e2136e;
    }

    .payment-logo.nagad {
      color: #ef5b25;
    }

    .payment-logo.visa {
      color: #183b8c;
      font-size: 17px;
    }

    /* =====================================================
       TERMS
    ===================================================== */

    .terms {
      margin-top: 20px;

      display: flex;

      gap: 9px;

      align-items: flex-start;

      font-size: 13px;

      color: var(--muted);
    }

    .terms input {
      width: 19px;
      height: 19px;

      margin-top: 1px;

      accent-color: var(--green);
    }

    .terms a {
      color: var(--green-dark);
    }

    /* =====================================================
       PLACE ORDER
    ===================================================== */

    .place-order {
      width: 100%;

      height: 52px;

      margin-top: 22px;

      border: none;

      border-radius: 6px;

      background: var(--green);

      color: white;

      font-size: 15px;

      font-weight: 700;

      letter-spacing: 0.3px;

      cursor: pointer;
    }

    .place-order:hover {
      background: var(--green-dark);
    }

    /* =====================================================
       EMPTY CART
    ===================================================== */

    .empty-checkout {
      text-align: center;

      padding: 45px 20px;

      color: var(--muted);
    }

    .empty-checkout a {
      display: inline-block;

      margin-top: 15px;

      color: var(--green-dark);

      font-weight: 600;

      text-decoration: none;
    }

    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 900px) {

      .checkout-wrap {
        grid-template-columns: 1fr;
      }

      .checkout-card {
        padding: 28px;
      }

    }

    @media (max-width: 600px) {

      .checkout-header {
        padding: 15px 20px;
      }

      .checkout-logo {
        font-size: 23px;
      }

      .checkout-wrap {
        width: 94%;
        margin-top: 18px;
      }

      .checkout-card {
        padding: 22px 18px;
      }

      .checkout-card h2 {
        font-size: 22px;
      }

      .checkout-item {
        grid-template-columns: 60px 1fr;
      }

      .checkout-item-image {
        width: 58px;
        height: 58px;
      }

      .item-right {
        grid-column: 2;
        text-align: left;
      }

      .quantity-control {
        justify-content: flex-start;
      }

      .payment-method {
        align-items: flex-start;
        flex-direction: column;
      }

      .payment-logos {
        justify-content: flex-start;
      }

    }

  </style>

</head>

  <script>

    /* =====================================================
       CANVO CHECKOUT JAVASCRIPT
    ===================================================== */

    let checkoutCart = [];

    let couponDiscount = 0;


    /* =====================================================
       LOAD CART
    ===================================================== */

  function loadCheckoutCart() {

  try {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const isBuyNow =
      params.get("buyNow") === "1";

    const storageKey =
      isBuyNow
        ? "canvoBuyNow"
        : "canvoCart";

    checkoutCart =
      JSON.parse(
        localStorage.getItem(storageKey)
      ) || [];

  } catch (error) {

    console.error(
      "Unable to load checkout items:",
      error
    );

    checkoutCart = [];

  }

  renderCheckout();

}


    /* =====================================================
       FORMAT PRICE
    ===================================================== */

    function money(value) {

      return "৳" +
        Number(value || 0).toLocaleString(
          "en-BD",
          {
            maximumFractionDigits: 0
          }
        );

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =====================================================
       RENDER CHECKOUT ITEMS
    ===================================================== */

    function renderCheckout() {

      const container =
        document.getElementById(
          "checkoutItems"
        );

      if (!container) return;


      if (!checkoutCart.length) {

        container.innerHTML = `
          <div class="empty-checkout">
            <p>
              Your cart is empty.
            </p>

            <a href="shop.html">
              Continue Shopping
            </a>
          </div>
        `;

        updateTotals();

        return;

      }


      container.innerHTML =
        checkoutCart.map(
          (item, index) => {

            const quantity =
              Number(item.quantity || 1);

            const price =
              Number(item.price || 0);

            const lineTotal =
              price * quantity;


            const variants = [];

            if (item.color) {

              variants.push(
                `<span>Colour: ${escapeHtml(item.color)}</span>`
              );

            }

            if (item.size) {

              variants.push(
                `<span>Size: ${escapeHtml(item.size)}</span>`
              );

            }


            return `
              <div class="checkout-item">

                <div class="checkout-item-image">

                  <img
                    src="${escapeHtml(item.image || "")}"
                    alt="${escapeHtml(item.name || "Product")}"
                  >

                </div>


                <div>

                  <div class="checkout-item-name">
                    ${escapeHtml(item.name || "Product")}
                  </div>

                  <div class="variant-text">
                    ${variants.join("")}
                  </div>

                  <div class="item-price">
                    ${money(lineTotal)}
                  </div>

                </div>


                <div class="item-right">

                  <div class="quantity-control">

                    <button
                      type="button"
                      onclick="changeCheckoutQuantity(${index}, -1)"
                    >
                      −
                    </button>

                    <span>
                      ${quantity}
                    </span>

                    <button
                      type="button"
                      onclick="changeCheckoutQuantity(${index}, 1)"
                    >
                      +
                    </button>

                  </div>

                </div>

              </div>
            `;

          }
        ).join("");


      updateTotals();

    }


    /* =====================================================
       CHANGE QUANTITY
    ===================================================== */

    function changeCheckoutQuantity(
      index,
      change
    ) {

      if (!checkoutCart[index]) return;


      let quantity =
        Number(
          checkoutCart[index].quantity || 1
        );


      quantity += change;


      if (quantity < 1) {

        quantity = 1;

      }


      checkoutCart[index].quantity =
        quantity;


      const params =
  new URLSearchParams(
    window.location.search
  );

const isBuyNow =
  params.get("buyNow") === "1";

const storageKey =
  isBuyNow
    ? "canvoBuyNow"
    : "canvoCart";

localStorage.setItem(
  storageKey,
  JSON.stringify(checkoutCart)
);


      renderCheckout();

    }


    /* =====================================================
       CALCULATE TOTAL
    ===================================================== */

    function updateTotals() {

      let subtotal = 0;


      checkoutCart.forEach(
        item => {

          subtotal +=
            Number(item.price || 0) *
            Number(item.quantity || 1);

        }
      );


      /*
       * Current CANVO rule:
       * Orders ৳2500 or more = FREE DELIVERY
       * Below ৳2500 = ৳60
       */

      const shipping =
        subtotal >= 2500 || subtotal === 0
          ? 0
          : 60;


      const total =
        Math.max(
          0,
          subtotal +
          shipping -
          couponDiscount
        );


      document.getElementById(
        "subtotal"
      ).textContent =
        money(subtotal);


      document.getElementById(
        "shipping"
      ).textContent =
        money(shipping);


      document.getElementById(
        "discount"
      ).textContent =
        money(couponDiscount);


      document.getElementById(
        "total"
      ).textContent =
        money(total);


      document.getElementById(
        "maxPayment"
      ).textContent =
        money(total);


      const partial =
        document.getElementById(
          "partialPayment"
        );


      if (partial) {

        partial.max = total;

        if (total < 500) {

          partial.value = total;

        }

      }

    }


    /* =====================================================
       COUPON
    ===================================================== */

    function applyCoupon() {

      const coupon =
        document.getElementById(
          "coupon"
        ).value
          .trim()
          .toUpperCase();


      /*
       * Coupon system will be connected
       * to D1 later.
       */

      if (!coupon) {

        alert(
          "Please enter a coupon code."
        );

        return;

      }


      alert(
        "Coupon system will be connected soon."
      );

    }


/* =====================================================
   PLACE ORDER
===================================================== */

async function placeOrder() {

  if (!checkoutCart.length) {

    alert(
      "Your cart is empty."
    );

    return;

  }


  const name =
    document.getElementById(
      "fullName"
    ).value.trim();


  const phone =
    document.getElementById(
      "phone"
    ).value.trim();


  const district =
    document.getElementById(
      "district"
    ).value;


  const thana =
    document.getElementById(
      "thana"
    ).value.trim();


  const address =
    document.getElementById(
      "address"
    ).value.trim();


  const noteElement =
    document.getElementById(
      "note"
    );


  const note =
    noteElement
      ? noteElement.value.trim()
      : "";


  const terms =
    document.getElementById(
      "terms"
    ).checked;


  if (
    !name ||
    !phone ||
    !district ||
    !thana ||
    !address
  ) {

    alert(
      "Please complete all required shipping information."
    );

    return;

  }


  if (!terms) {

    alert(
      "Please agree to the Return Policy and Terms & Conditions."
    );

    return;

  }


  /*
   * Get partial payment amount
   */

const partialPaymentInput =
  document.getElementById(
    "partialPayment"
  );

const partialPayment =
  partialPaymentInput
    ? Number(
        partialPaymentInput.value || 0
      )
    : 0;


  /*
   * Prepare order items
   */

  const items =
    checkoutCart.map(
      item => ({

        productId:
          Number(item.productId),

        variantId:
          Number(item.variantId),

        quantity:
          Number(item.quantity)

      })
    );


  /*
   * Find PLACE ORDER button
   */

  const button =
    document.querySelector(
      'button[onclick="placeOrder()"]'
    );


  if (button) {

    button.disabled = true;

    button.textContent =
      "PLACING ORDER...";

  }


  try {

    /*
     * Send order to Cloudflare Worker
     */

    const response =
      await fetch(
        "/api/orders",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              customer: {

                name,

                phone,

                district,

                thana,

                address,

                note

              },

              items,

              discount:
                Number(
                  couponDiscount || 0
                ),

              partialPayment,

              paymentMethod:
                "online"

            })

        }
      );


    /*
     * Read API response
     */

    const data =
      await response.json();


    /*
     * Check API response
     */

    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "Unable to place order."
      );

    }


    /*
     * SUCCESS
     */

    alert(
      `Order placed successfully!\n\nOrder Number: ${data.order.orderNumber}\nTotal: ৳${Number(data.order.total).toLocaleString()}`
    );


    /*
     * Detect Buy Now checkout
     */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const isBuyNow =
      params.get("buyNow") === "1";


    /*
     * Clear correct storage
     */

    if (isBuyNow) {

      localStorage.removeItem(
        "canvoBuyNow"
      );

    } else {

      localStorage.removeItem(
        "canvoCart"
      );

    }


    /*
     * Clear checkout items
     */

    checkoutCart = [];


    /*
     * Return to home page
     */

    window.location.href =
      "index.html";


  } catch (error) {

    console.error(
      "Place order error:",
      error
    );


    alert(
      error.message ||
      "Unable to place order. Please try again."
    );


    /*
     * Enable button again
     */

    if (button) {

      button.disabled = false;

      button.textContent =
        "PLACE ORDER";

    }

  }

}


    /* =====================================================
       START
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      loadCheckoutCart
    );

  </script>
