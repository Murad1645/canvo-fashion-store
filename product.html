<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Product | CANVO</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    /* =====================================================
       CANVO — DEDICATED PRODUCT PAGE
    ====================================================== */

    :root {
      --canvo-green: #0f9f6e;
      --canvo-green-dark: #087653;
      --canvo-gold: #c79a3b;
      --canvo-navy: #0b1026;
      --canvo-text: #171717;
      --canvo-muted: #777;
      --canvo-border: #e2e2e2;
      --canvo-light: #f7f7f5;
    }

    body {
      background: #fff;
    }

    .canvo-product-page {
      max-width: 1320px;
      margin: 0 auto;
      padding: 42px 34px 90px;
    }

    .canvo-breadcrumb {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      margin-bottom: 34px;
      font-size: 14px;
      color: #777;
    }

    .canvo-breadcrumb a {
      color: #555;
      text-decoration: none;
    }

    .canvo-breadcrumb a:hover {
      color: var(--canvo-green);
    }

    .canvo-product-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(420px, 0.92fr);
      gap: 68px;
      align-items: start;
    }

    /* =====================================================
       GALLERY
    ====================================================== */

    .canvo-gallery {
      min-width: 0;
    }

    .canvo-main-image-wrap {
      width: 100%;
      background: #f5f5f5;
      overflow: hidden;
      border-radius: 2px;
    }

    #detailProductImage {
      width: 100%;
      height: min(650px, 62vw);
      min-height: 440px;
      display: block;
      object-fit: contain;
      background: #f5f5f5;
    }

    #productThumbnails {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .canvo-product-thumbnail {
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 0;
      margin: 0;
      border: 1px solid var(--canvo-border);
      border-radius: 3px;
      background: #f7f7f7;
      overflow: hidden;
      cursor: pointer;
      transition:
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .canvo-product-thumbnail:hover {
      transform: translateY(-2px);
      border-color: #999;
    }

    .canvo-product-thumbnail.active {
      border: 2px solid var(--canvo-green);
    }

    .canvo-product-thumbnail img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* =====================================================
       PRODUCT INFORMATION
    ====================================================== */

    .canvo-product-info {
      padding-top: 4px;
    }

    #detailProductCategory {
      margin: 0 0 14px;
      color: var(--canvo-gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    #detailProductName {
      margin: 0 0 22px;
      color: var(--canvo-text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 4vw, 64px);
      line-height: 0.98;
      font-weight: 500;
      letter-spacing: -0.035em;
    }

    .canvo-price-row {
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    #detailProductPrice {
      color: #111;
      font-size: 25px;
      font-weight: 700;
    }

    #detailProductOldPrice {
      color: #999;
      font-size: 18px;
      text-decoration: line-through;
    }

    .canvo-product-description {
      margin: 0 0 34px;
      color: #666;
      font-size: 16px;
      line-height: 1.8;
    }

    .canvo-selection-box {
      margin-bottom: 26px;
    }

    .canvo-selection-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 12px;
    }

    .canvo-selection-heading strong {
      color: #151515;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .canvo-selection-heading span {
      color: #777;
      font-size: 13px;
    }

    #sizeOptions,
    #colorOptions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .variant-option {
      min-width: 58px;
      min-height: 50px;
      padding: 10px 17px;
      border: 1px solid #d7d7d7;
      border-radius: 0;
      background: #fff;
      color: #222;
      font-size: 14px;
      cursor: pointer;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .variant-option:hover:not(:disabled) {
      border-color: var(--canvo-green);
    }

    .variant-option.active {
      border-color: var(--canvo-navy);
      background: var(--canvo-navy);
      color: #fff;
    }

    .variant-option.disabled,
    .variant-option:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .canvo-stock {
      margin: 24px 0 30px;
      padding: 16px 18px;
      border-left: 3px solid var(--canvo-gold);
      background: #f7f5ef;
      color: #555;
      font-size: 14px;
    }

    .detail-stock.in-stock {
      color: #087653;
    }

    .detail-stock.out-of-stock {
      color: #a43d3d;
    }

    .canvo-quantity-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .canvo-quantity-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .canvo-quantity-control {
      display: flex;
      align-items: center;
      border: 1px solid #d7d7d7;
    }

    .canvo-quantity-control button {
      width: 46px;
      height: 46px;
      border: 0;
      background: #fff;
      color: #111;
      font-size: 20px;
      cursor: pointer;
    }

    .canvo-quantity-control span {
      width: 44px;
      text-align: center;
      font-size: 15px;
    }

    .canvo-action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .canvo-action-row button {
      min-height: 58px;
      border: 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .canvo-action-row button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    #detailBuyNow {
      background: #3ca57d;
      color: #fff;
    }

    #detailAddToCart {
      background: #00b94f;
      color: #fff;
    }

    .canvo-action-row button:disabled {
      background: #d3d3d3 !important;
      color: #fff !important;
      cursor: not-allowed;
      transform: none;
    }

    .canvo-product-page-message {
      min-height: 55vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 60px 20px;
    }

    .canvo-product-page-message h1 {
      margin-bottom: 12px;
      font-family: Georgia, "Times New Roman", serif;
    }

    .canvo-product-page-message p {
      color: #777;
      margin-bottom: 24px;
    }

    .product-back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      background: var(--canvo-navy);
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    /* =====================================================
       SIMPLE CART PANEL
    ====================================================== */

    #cartPanel {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      visibility: hidden;
    }

    #cartPanel.active {
      pointer-events: auto;
      visibility: visible;
    }

    .canvo-cart-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #cartPanel.active .canvo-cart-overlay {
      opacity: 1;
    }

    .canvo-cart-drawer {
      position: absolute;
      top: 0;
      right: 0;
      width: min(430px, 92vw);
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #fff;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      box-shadow: -10px 0 35px rgba(0, 0, 0, 0.12);
    }

    #cartPanel.active .canvo-cart-drawer {
      transform: translateX(0);
    }

    .canvo-cart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px;
      border-bottom: 1px solid #eee;
    }

    .canvo-cart-header h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 26px;
    }

    .canvo-cart-header button {
      border: 0;
      background: none;
      font-size: 28px;
      cursor: pointer;
    }

    #cartItems {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }

    .canvo-cart-footer {
      padding: 20px;
      border-top: 1px solid #eee;
    }

    .canvo-cart-total {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .canvo-cart-checkout {
      width: 100%;
      min-height: 52px;
      border: 0;
      background: var(--canvo-navy);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    /* =====================================================
       RESPONSIVE
    ====================================================== */

    @media (max-width: 980px) {

      .canvo-product-page {
        padding: 28px 20px 70px;
      }

      .canvo-product-layout {
        grid-template-columns: 1fr;
        gap: 42px;
      }

      #detailProductImage {
        height: 70vw;
        min-height: 380px;
        max-height: 650px;
      }

      #detailProductName {
        font-size: 48px;
      }

    }

    @media (max-width: 600px) {

      .canvo-product-page {
        padding: 22px 14px 60px;
      }

      .canvo-breadcrumb {
        margin-bottom: 22px;
        font-size: 12px;
      }

      #detailProductImage {
        height: 88vw;
        min-height: 300px;
      }

      #productThumbnails {
        gap: 8px;
      }

      #detailProductName {
        font-size: 40px;
      }

      .canvo-product-description {
        font-size: 14px;
      }

      .canvo-action-row {
        grid-template-columns: 1fr;
      }

      .canvo-quantity-row {
        align-items: flex-start;
        flex-direction: column;
      }

    }

  </style>

  <style>
  .site-header .logo img,
  header .logo img,
  .navbar .logo img {
    width: 150px !important;
    height: auto !important;
    max-height: 70px !important;
    object-fit: contain;
  }
</style>
  
</head>


<body>

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <a
      class="logo"
      href="index.html"
      aria-label="CANVO Home"
    >

      <img
        src="images/logo.png"
        alt="CANVO"
      >

    </a>


    <nav
      class="nav"
      id="nav"
    >

      <a href="index.html">
        Home
      </a>

      <a href="shop.html">
        Shop
      </a>

      <a href="shop.html">
        New Arrivals
      </a>

      <a href="shop.html">
        Best Sellers
      </a>

      <a href="index.html#about">
        About
      </a>

    </nav>


    <div class="header-actions">

      <button
        aria-label="Search"
        class="icon-btn"
        type="button"
        onclick="window.location.href='shop.html'"
      >
        ⌕
      </button>


      <button
        aria-label="Wishlist"
        class="icon-btn"
        type="button"
        onclick="openWishlist()"
      >
        ♡
      </button>


      <button
        aria-label="Cart"
        class="icon-btn cart-btn"
        type="button"
        onclick="openCart()"
      >

        🛒

        <span id="cartCount">
          0
        </span>

      </button>


      <button
        class="menu-btn"
        type="button"
        onclick="toggleMenu()"
      >
        ☰
      </button>

    </div>

  </header>


  <!-- =====================================================
       PRODUCT PAGE
  ====================================================== -->

  <main
    id="productPage"
    class="canvo-product-page"
  >

    <div class="canvo-breadcrumb">

      <a href="index.html">
        Home
      </a>

      <span>/</span>

      <a href="shop.html">
        Shop
      </a>

      <span>/</span>

      <span id="productBreadcrumbName">
        Product
      </span>

    </div>


    <div class="canvo-product-layout">

      <!-- =================================================
           LEFT — PRODUCT GALLERY
      ================================================== -->

      <section class="canvo-gallery">

        <div class="canvo-main-image-wrap">

          <img
            id="detailProductImage"
            src=""
            alt=""
          >

        </div>


        <div
          id="productThumbnails"
          aria-label="Product images"
        ></div>

      </section>


      <!-- =================================================
           RIGHT — PRODUCT INFORMATION
      ================================================== -->

      <section class="canvo-product-info">

        <p
          id="detailProductCategory"
          class="eyebrow"
        ></p>


        <h1
          id="detailProductName"
        >
          Loading...
        </h1>


        <div class="canvo-price-row">

          <strong
            id="detailProductPrice"
          >
          </strong>


          <span
            id="detailProductOldPrice"
          ></span>

        </div>


        <p
          id="detailProductDescription"
          class="canvo-product-description"
        >
        </p>


        <!-- SIZE -->

        <div
          class="canvo-selection-box"
          id="sizeSection"
        >

          <div class="canvo-selection-heading">

            <strong>
              Size
            </strong>

            <span id="selectedSizeText">
              Select
            </span>

          </div>


          <div id="sizeOptions"></div>

        </div>


        <!-- COLOR -->

        <div
          class="canvo-selection-box"
          id="colorSection"
        >

          <div class="canvo-selection-heading">

            <strong>
              Color
            </strong>

            <span id="selectedColorText">
              Select
            </span>

          </div>


          <div id="colorOptions"></div>

        </div>


        <!-- STOCK -->

        <div
          id="detailStock"
          class="canvo-stock detail-stock"
        >
          Loading available variants...
        </div>


        <!-- QUANTITY -->

        <div class="canvo-quantity-row">

          <span class="canvo-quantity-label">
            Quantity
          </span>


          <div class="canvo-quantity-control">

            <button
              type="button"
              onclick="decreaseDetailQuantity()"
              aria-label="Decrease quantity"
            >
              −
            </button>


            <span id="detailQuantity">
              1
            </span>


            <button
              type="button"
              onclick="increaseDetailQuantity()"
              aria-label="Increase quantity"
            >
              +
            </button>

          </div>

        </div>


        <!-- ACTIONS -->

        <div class="canvo-action-row">

          <button
            id="detailBuyNow"
            type="button"
            onclick="buyNowSelectedVariant()"
            disabled
          >
            BUY NOW
          </button>


          <button
            id="detailAddToCart"
            type="button"
            onclick="addSelectedVariantToCart()"
            disabled
          >
            SELECT SIZE
          </button>

        </div>

      </section>

    </div>

  </main>


  <!-- =====================================================
       CART
  ====================================================== -->

  <div
    id="cartPanel"
    aria-hidden="true"
  >

    <div
      class="canvo-cart-overlay"
      onclick="closeCart()"
    ></div>


    <aside class="canvo-cart-drawer">

      <div class="canvo-cart-header">

        <h2>
          Your Cart
        </h2>

        <button
          type="button"
          onclick="closeCart()"
          aria-label="Close cart"
        >
          ×
        </button>

      </div>


      <div id="cartItems"></div>


      <div class="canvo-cart-footer">

        <div class="canvo-cart-total">

          <span>
            Total
          </span>

          <span id="cartTotal">
            ৳0
          </span>

        </div>


        <button
          class="canvo-cart-checkout"
          type="button"
          onclick="checkout()"
        >
          CHECKOUT
        </button>

      </div>

    </aside>

  </div>


  <!-- =====================================================
       SCRIPTS
  ====================================================== -->

  <script src="js/products.js"></script>

  <script src="js/app.js"></script>

</body>

</html>
