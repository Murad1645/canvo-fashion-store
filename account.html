<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Account | CANVO</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--green:#399f7a;--navy:#10132b;--line:#e4e7ec;--muted:#667085}*{box-sizing:border-box}body{margin:0;color:var(--navy);font:14px Montserrat,Arial,sans-serif;background:#f7f8fa}.top{background:var(--navy);color:#f2d36e;text-align:center;padding:9px;font-size:11px;font-weight:700;letter-spacing:.12em}.header{height:88px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,80px)}.header img{width:105px;height:66px;object-fit:contain}.header a{color:var(--navy);text-decoration:none;font-weight:700}.wrap{max-width:1240px;margin:36px auto;padding:0 20px}.welcome h1{font:700 34px 'Playfair Display',serif;margin:0 0 6px}.welcome p{color:var(--muted);margin:0 0 24px}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}.sidebar,.content{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px #10132b08}.sidebar{padding:12px;height:max-content}.side-btn{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:14px 13px;border-radius:7px;color:#344054;text-align:left;font:600 13px Montserrat;cursor:pointer}.side-btn.active,.side-btn:hover{background:#eaf5f0;color:#16835f}.content{padding:26px;min-height:380px}.content h2{margin:0 0 20px;font-size:22px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat{padding:18px;border-radius:9px;background:#eaf5f0}.stat span{display:block;color:#475467;font-size:12px}.stat strong{display:block;font-size:27px;margin-top:8px}.muted{color:var(--muted)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:12px}th{color:#667085;background:#fafafa}.pill{display:inline-block;background:#fff4d6;color:#805b00;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:block;font-size:12px;font-weight:700;margin-bottom:15px}.field input,.field textarea{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #d0d5dd;border-radius:7px;font:14px Montserrat;outline-color:var(--green)}.btn{border:0;border-radius:7px;background:var(--green);color:#fff;font:700 13px Montserrat;padding:13px 18px;cursor:pointer}.btn.secondary{background:#edf2f0;color:#243b34}.message{margin:14px 0 0;color:var(--green)}.product-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.product{border:1px solid var(--line);border-radius:8px;overflow:hidden}.product img{width:100%;aspect-ratio:1;object-fit:cover;background:#f1f2f4}.product div{padding:10px}.product strong{display:block;font-size:12px;margin-bottom:8px}.product button{font-size:11px;padding:8px}.empty{padding:36px 10px;text-align:center;color:var(--muted)}@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:18px}.stats{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.welcome h1{font-size:28px}}
</style></head><body><div class="top">WELCOME TO YOUR CANVO ACCOUNT</div><header class="header"><a href="index.html"><img src="images/logo.png" alt="CANVO"></a><nav><a href="index.html">Continue Shopping</a>　<button class="btn secondary" id="logoutBtn">Logout</button></nav></header><main class="wrap"><section class="welcome"><h1 id="greeting">My Account</h1><p>Manage your orders, personal information and saved products.</p></section><div class="layout"><aside class="sidebar" aria-label="Account navigation"><button class="side-btn active" data-section="overview">▦　Overview</button><button class="side-btn" data-section="orders">🛒　Order History</button><button class="side-btn" data-section="tracking">☷　Track Order</button><button class="side-btn" data-section="details">♙　Account Details</button><button class="side-btn" data-section="wishlist">♡　Wishlist</button><button class="side-btn" data-section="settings">⚙　Settings</button></aside><section class="content" id="accountContent"><p class="empty">Loading your account…</p></section></div></main>
<script>
let profile=null,orders=[],wishlist=[];const content=document.getElementById('accountContent');const labels={overview:'Dashboard Overview',orders:'Order History',tracking:'Track Order',details:'Account Details',wishlist:'My Wishlist',settings:'Account Settings'};
async function api(url,options={}){const res=await fetch(url,{credentials:'same-origin',cache:'no-store',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await res.json().catch(()=>({}));if(res.status===401){location.href='login.html?returnTo='+encodeURIComponent('account.html');throw new Error('Please log in again.')}if(!res.ok||data.ok===false)throw new Error(data.error||'Request failed.');return data}
async function init(){try{const [p,o,w]=await Promise.all([api('/api/customer/profile'),api('/api/customer/orders'),api('/api/customer/wishlist')]);profile=p.profile;orders=o.orders||[];wishlist=w.wishlist||[];document.getElementById('greeting').textContent='Welcome, '+(profile.name||'Customer');const requested=new URLSearchParams(location.search).get('section')||'overview';showSection(labels[requested]?requested:'overview')}catch(e){content.innerHTML='<p class="empty">'+esc(e.message)+'</p>'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '৳'+Number(n||0).toLocaleString('en-BD')}
function showSection(section){document.querySelectorAll('.side-btn').forEach(b=>b.classList.toggle('active',b.dataset.section===section));history.replaceState(null,'',section==='overview'?'account.html':'account.html?section='+section);let html=`<h2>${labels[section]}</h2>`;
if(section==='overview'){html+=`<div class="stats"><div class="stat"><span>Total Orders</span><strong>${orders.length}</strong></div><div class="stat"><span>Pending Orders</span><strong>${orders.filter(o=>/pending|processing/i.test(o.order_status||'')).length}</strong></div><div class="stat"><span>Wishlist Items</span><strong>${wishlist.length}</strong></div></div><h3>Recent Orders</h3>${orderTable(orders.slice(0,5))}`}
if(section==='orders'||section==='tracking'){html+=section==='tracking'?'<p class="muted">Your latest order status is shown below. Status updates are supplied by CANVO.</p>':'';html+=orderTable(orders)}
if(section==='details'){html+=`<form id="profileForm"><div class="form-grid"><label class="field">Full Name<input name="name" required minlength="2" maxlength="100" value="${esc(profile.name)}"></label><label class="field">Phone Number<input value="${esc(profile.phone)}" readonly aria-readonly="true"></label></div><label class="field">Address<textarea name="address" rows="3" maxlength="500">${esc(profile.address)}</textarea></label><label class="field">District / City<input name="city" maxlength="100" value="${esc(profile.city)}"></label><button class="btn" type="submit">Save Details</button><p id="formMessage" class="message"></p></form>`}
if(section==='wishlist'){html+=wishlist.length?'<div class="product-list">'+wishlist.map(p=>`<article class="product"><a href="product.html?id=${Number(p.id)}"><img src="${esc(p.image_url||'') }" alt="${esc(p.name)}" onerror="this.style.visibility='hidden'"></a><div><strong>${esc(p.name)}</strong><p>${money(p.price)}</p><button class="btn secondary" onclick="removeWishlist(${Number(p.id)})">Remove</button></div></article>`).join('')+'</div>':'<p class="empty">Your wishlist is empty. Save products you love to find them here.</p>'}
if(section==='settings'){html+='<p>Keep your password private and log out on shared devices.</p><button class="btn" id="settingsLogout">Log Out</button><p class="muted">For password changes or account deletion, contact CANVO Customer Care.</p>'}
content.innerHTML=html;const pf=document.getElementById('profileForm');if(pf)pf.addEventListener('submit',saveProfile);const sl=document.getElementById('settingsLogout');if(sl)sl.addEventListener('click',logout)}
function orderTable(list){if(!list.length)return '<p class="empty">No orders found yet. <a href="index.html">Start shopping</a>.</p>';return '<div class="table-wrap"><table><thead><tr><th>Order</th><th>Date</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody>'+list.map(o=>`<tr><td><strong>${esc(o.order_number)}</strong></td><td>${esc((o.created_at||'').slice(0,10))}</td><td>${money(o.total_amount)}</td><td>${esc(o.payment_status||'pending')}</td><td><span class="pill">${esc(o.order_status||'pending')}</span></td></tr>`).join('')+'</tbody></table></div>'}
async function saveProfile(e){e.preventDefault();const form=e.currentTarget;const msg=document.getElementById('formMessage');try{const data=Object.fromEntries(new FormData(form).entries());await api('/api/customer/profile',{method:'PATCH',body:JSON.stringify(data)});profile={...profile,...data};msg.textContent='Your details have been saved.';document.getElementById('greeting').textContent='Welcome, '+profile.name}catch(err){msg.style.color='#b42318';msg.textContent=err.message}}
async function removeWishlist(id){try{await api('/api/customer/wishlist/'+id,{method:'DELETE'});wishlist=wishlist.filter(p=>Number(p.id)!==Number(id));showSection('wishlist')}catch(e){alert(e.message)}}async function logout(){try{await fetch('/api/customer/logout',{method:'POST',credentials:'same-origin'})}finally{location.href='index.html'}}document.getElementById('logoutBtn').addEventListener('click',logout);document.querySelectorAll('.side-btn').forEach(b=>b.addEventListener('click',()=>showSection(b.dataset.section)));init();
</script></body></html>
