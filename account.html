<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Account | CANVO</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--green:#399f7a;--navy:#10132b;--line:#e4e7ec;--muted:#667085}*{box-sizing:border-box}body{margin:0;color:var(--navy);font:14px Montserrat,Arial,sans-serif;background:#f7f8fa}.top{background:var(--navy);color:#f2d36e;text-align:center;padding:9px;font-size:11px;font-weight:700;letter-spacing:.12em}.header{height:88px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,80px)}.header img{width:105px;height:66px;object-fit:contain}.header a{color:var(--navy);text-decoration:none;font-weight:700}.wrap{max-width:1240px;margin:36px auto;padding:0 20px}.welcome h1{font:700 34px 'Playfair Display',serif;margin:0 0 6px}.welcome p{color:var(--muted);margin:0 0 24px}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}.sidebar,.content{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px #10132b08}.sidebar{padding:12px;height:max-content}.side-btn{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:14px 13px;border-radius:7px;color:#344054;text-align:left;font:600 13px Montserrat;cursor:pointer}.side-btn.active,.side-btn:hover{background:#eaf5f0;color:#16835f}.content{padding:26px;min-height:380px}.content h2{margin:0 0 20px;font-size:22px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat{padding:18px;border-radius:9px;background:#eaf5f0}.stat span{display:block;color:#475467;font-size:12px}.stat strong{display:block;font-size:27px;margin-top:8px}.muted{color:var(--muted)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:12px}th{color:#667085;background:#fafafa}.pill{display:inline-block;background:#fff4d6;color:#805b00;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:block;font-size:12px;font-weight:700;margin-bottom:15px}.field input,.field textarea{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #d0d5dd;border-radius:7px;font:14px Montserrat;outline-color:var(--green)}.btn{border:0;border-radius:7px;background:var(--green);color:#fff;font:700 13px Montserrat;padding:13px 18px;cursor:pointer}.btn.secondary{background:#edf2f0;color:#243b34}.message{margin:14px 0 0;color:var(--green)}.product-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.product{border:1px solid var(--line);border-radius:8px;overflow:hidden}.product img{width:100%;aspect-ratio:1;object-fit:cover;background:#f1f2f4}.product div{padding:10px}.product strong{display:block;font-size:12px;margin-bottom:8px}.product button{font-size:11px;padding:8px}.empty{padding:36px 10px;text-align:center;color:var(--muted)}.track-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 24px}.track-form label{font-size:12px;font-weight:700}.track-form input{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #d0d5dd;border-radius:7px;font:14px Montserrat}.track-form button{grid-column:1/-1}.track-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px}.timeline{position:relative;padding:8px 0 8px 8px}.timeline-step{position:relative;display:grid;grid-template-columns:28px 1fr;gap:12px;min-height:72px}.timeline-step:not(:last-child):before{content:"";position:absolute;left:10px;top:23px;bottom:-2px;width:2px;background:#d0d5dd}.timeline-dot{z-index:1;width:22px;height:22px;border-radius:50%;background:#d0d5dd;border:3px solid #fff;box-shadow:0 0 0 1px #d0d5dd}.timeline-step.done .timeline-dot{background:var(--green);box-shadow:0 0 0 1px var(--green)}.timeline-step.current strong{color:var(--green)}.timeline-step strong{font-size:14px}.timeline-step small{display:block;color:var(--muted);margin-top:5px}.track-card{border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px}.status-note{color:var(--muted);font-size:12px;margin-top:8px}@media(max-width:760px){.track-layout{grid-template-columns:1fr}.track-form{grid-template-columns:1fr}}@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:18px}.stats{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.welcome h1{font-size:28px}}
</style></head><body><div class="top">WELCOME TO YOUR CANVO ACCOUNT</div><header class="header"><a href="index.html"><img src="images/logo.png" alt="CANVO"></a><nav><a href="index.html">Continue Shopping</a>　<button class="btn secondary" id="logoutBtn">Logout</button></nav></header><main class="wrap"><section class="welcome"><h1 id="greeting">My Account</h1><p>Manage your orders, personal information and saved products.</p></section><div class="layout"><aside class="sidebar" aria-label="Account navigation"><button class="side-btn active" data-section="overview">▦　Overview</button><button class="side-btn" data-section="orders">🛒　Order History</button><button class="side-btn" data-section="tracking">☷　Track Order</button><button class="side-btn" data-section="details">♙　Account Details</button><button class="side-btn" data-section="wishlist">♡　Wishlist</button><button class="side-btn" data-section="settings">⚙　Settings</button></aside><section class="content" id="accountContent"><p class="empty">Loading your account…</p></section></div></main>
<script>
let profile=null,orders=[],wishlist=[];const content=document.getElementById('accountContent');const labels={overview:'Dashboard Overview',orders:'Order History',tracking:'Track Order',details:'Account Details',wishlist:'My Wishlist',settings:'Account Settings'};
async function api(url,options={}){const res=await fetch(url,{credentials:'same-origin',cache:'no-store',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await res.json().catch(()=>({}));if(res.status===401){location.href='login.html?returnTo='+encodeURIComponent('account.html');throw new Error('Please log in again.')}if(!res.ok||data.ok===false)throw new Error(data.error||'Request failed.');return data}
async function init(){try{const [p,o,w]=await Promise.all([api('/api/customer/profile'),api('/api/customer/orders'),api('/api/customer/wishlist')]);profile=p.profile;orders=o.orders||[];wishlist=w.wishlist||[];document.getElementById('greeting').textContent='Welcome, '+(profile.name||'Customer');const requested=new URLSearchParams(location.search).get('section')||'overview';showSection(labels[requested]?requested:'overview')}catch(e){content.innerHTML='<p class="empty">'+esc(e.message)+'</p>'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '৳'+Number(n||0).toLocaleString('en-BD')}
function showSection(section){document.querySelectorAll('.side-btn').forEach(b=>b.classList.toggle('active',b.dataset.section===section));history.replaceState(null,'',section==='overview'?'account.html':'account.html?section='+section);let html=`<h2>${labels[section]}</h2>`;
if(section==='overview'){html+=`<div class="stats"><div class="stat"><span>Total Orders</span><strong>${orders.length}</strong></div><div class="stat"><span>Pending Orders</span><strong>${orders.filter(o=>/pending|processing/i.test(o.order_status||'')).length}</strong></div><div class="stat"><span>Wishlist Items</span><strong>${wishlist.length}</strong></div></div><h3>Recent Orders</h3>${orderTable(orders.slice(0,5))}`}
if(section==='orders'){html+=orderTable(orders)}
if(section==='tracking'){html+=trackingMarkup()}
if(section==='details'){html+=`<form id="profileForm"><div class="form-grid"><label class="field">Full Name<input name="name" required minlength="2" maxlength="100" value="${esc(profile.name)}"></label><label class="field">Phone Number<input value="${esc(profile.phone)}" readonly aria-readonly="true"></label></div><label class="field">Address<textarea name="address" rows="3" maxlength="500">${esc(profile.address)}</textarea></label><label class="field">District / City<input name="city" maxlength="100" value="${esc(profile.city)}"></label><button class="btn" type="submit">Save Details</button><p id="formMessage" class="message"></p></form>`}
if(section==='wishlist'){html+=wishlist.length?'<div class="product-list">'+wishlist.map(p=>`<article class="product"><a href="product.html?id=${Number(p.id)}"><img src="${esc(p.image_url||'') }" alt="${esc(p.name)}" onerror="this.style.visibility='hidden'"></a><div><strong>${esc(p.name)}</strong><p>${money(p.price)}</p><button class="btn secondary" onclick="removeWishlist(${Number(p.id)})">Remove</button></div></article>`).join('')+'</div>':'<p class="empty">Your wishlist is empty. Save products you love to find them here.</p>'}
if(section==='settings'){html+='<p>Keep your password private and log out on shared devices.</p><button class="btn" id="settingsLogout">Log Out</button><p class="muted">For password changes or account deletion, contact CANVO Customer Care.</p>'}
content.innerHTML=html;const pf=document.getElementById('profileForm');if(pf)pf.addEventListener('submit',saveProfile);const sl=document.getElementById('settingsLogout');if(sl)sl.addEventListener('click',logout);const tf=document.getElementById('trackForm');if(tf)tf.addEventListener('submit',trackOrder)}
function trackingMarkup(){return `<p class="muted">Enter the order number and the phone number linked to your account. You can track only orders placed under your signed-in account.</p><form class="track-form" id="trackForm"><label>Order Number<input name="orderNumber" required placeholder="e.g. CANVO-..." autocomplete="off"></label><label>Phone Number<input name="phone" required value="${esc(profile.phone||'')}" inputmode="tel" autocomplete="tel"></label><button class="btn" type="submit">TRACK ORDER</button></form><div id="trackingResult"><p class="empty">Choose an order from your Order History, or enter its order number above.</p>${orders.length?`<div class="table-wrap"><table><thead><tr><th>Order</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>${orders.map(o=>`<tr><td>${esc(o.order_number)}</td><td>${esc((o.created_at||'').slice(0,10))}</td><td><span class="pill">${esc(statusLabel(o.order_status))}</span></td><td><button class="btn secondary" type="button" onclick="quickTrack(${Number(o.id)})">Track</button></td></tr>`).join('')}</tbody></table></div>`:''}</div>`}
const trackingSteps=[['pending','Pending','Order received; awaiting confirmation.'],['confirmed','Confirmed','CANVO confirmed your order.'],['processing','Processing','Your items are being prepared.'],['packaging','Packaging','Your items are being packed.'],['shipped','Shipped','Your parcel has been handed to delivery.'],['delivered','Delivered','Your order has been delivered.']];
function statusLabel(s){return ({pending:'Pending',confirmed:'Confirmed',processing:'Processing',packaging:'Packaging',shipped:'Shipped',delivered:'Delivered',cancelled:'Cancelled',delivery_failed:'Delivery Failed'})[String(s||'pending').toLowerCase()]||String(s||'Pending')}
function dateLabel(v){if(!v)return 'Time not recorded';const d=new Date(v.replace(' ','T')+(String(v).endsWith('Z')?'':'Z'));return Number.isNaN(d.getTime())?esc(v):d.toLocaleString()}
async function quickTrack(id){const o=orders.find(x=>Number(x.id)===Number(id));if(!o)return;const form=document.getElementById('trackForm');if(form){form.elements.orderNumber.value=o.order_number;form.elements.phone.value=profile.phone||o.shipping_phone||''}await showTrackingForOrder(o)}
async function trackOrder(e){e.preventDefault();const form=e.currentTarget;const orderNo=String(form.elements.orderNumber.value||'').trim().toLowerCase();const phone=String(form.elements.phone.value||'').replace(/\D/g,'');const ownPhone=String(profile.phone||'').replace(/\D/g,'');if(!phone||phone!==ownPhone){document.getElementById('trackingResult').innerHTML='<p class="empty">The phone number must match the phone number on your signed-in account.</p>';return}const order=orders.find(o=>String(o.order_number||'').toLowerCase()===orderNo);if(!order){document.getElementById('trackingResult').innerHTML='<p class="empty">No matching order was found in your account.</p>';return}await showTrackingForOrder(order)}
async function showTrackingForOrder(order){const box=document.getElementById('trackingResult');if(!box)return;box.innerHTML='<p class="empty">Loading tracking details…</p>';try{const data=await api(`/api/customer/orders/${Number(order.id)}/tracking`);const history=data.history||[];const status=String(data.order.order_status||'pending').toLowerCase();const terminal=['cancelled','delivery_failed'].includes(status);const currentIndex=trackingSteps.findIndex(s=>s[0]===status);const rows=trackingSteps.map((step,i)=>{const h=[...history].reverse().find(x=>String(x.new_status).toLowerCase()===step[0]);const done=!terminal&&((currentIndex>=0&&i<=currentIndex)||!!h);const current=step[0]===status;const time=h?.created_at||(step[0]==='pending'?data.order.created_at:null);return `<div class="timeline-step ${done?'done':''} ${current?'current':''}"><span class="timeline-dot"></span><div><strong>${step[1]}</strong><small>${time?esc(dateLabel(time)):(done?'Completed':'Not yet completed')}</small>${h?.note?`<small>${esc(h.note)}</small>`:''}</div></div>`}).join('');const terminalHtml=terminal?`<div class="track-card"><strong>${statusLabel(status)}</strong><p class="status-note">${status==='cancelled'?'This order was cancelled.':'Delivery could not be completed. Please contact CANVO for assistance.'}</p>${history.filter(h=>['cancelled','delivery_failed'].includes(String(h.new_status).toLowerCase())).map(h=>`<p class="status-note">${esc(dateLabel(h.created_at))} — ${esc(h.note||statusLabel(h.new_status))}</p>`).join('')}</div>`:'';box.innerHTML=`<div class="track-card"><strong>Order ${esc(data.order.order_number)}</strong><p class="status-note">Current status: ${esc(statusLabel(status))}</p><div class="track-layout"><div><h3>Order progress</h3><p class="status-note">Status updates are supplied by CANVO. Refresh this page to check for the latest update.</p></div><div class="timeline">${rows}</div></div>${terminalHtml}</div>`}catch(err){box.innerHTML=`<p class="empty">${esc(err.message)}</p>`}}
function orderTable(list){if(!list.length)return '<p class="empty">No orders found yet. <a href="index.html">Start shopping</a>.</p>';return '<div class="table-wrap"><table><thead><tr><th>Order</th><th>Date</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody>'+list.map(o=>`<tr><td><strong>${esc(o.order_number)}</strong></td><td>${esc((o.created_at||'').slice(0,10))}</td><td>${money(o.total_amount)}</td><td>${esc(o.payment_status||'pending')}</td><td><span class="pill">${esc(o.order_status||'pending')}</span></td></tr>`).join('')+'</tbody></table></div>'}
async function saveProfile(e){e.preventDefault();const form=e.currentTarget;const msg=document.getElementById('formMessage');try{const data=Object.fromEntries(new FormData(form).entries());await api('/api/customer/profile',{method:'PATCH',body:JSON.stringify(data)});profile={...profile,...data};msg.textContent='Your details have been saved.';document.getElementById('greeting').textContent='Welcome, '+profile.name}catch(err){msg.style.color='#b42318';msg.textContent=err.message}}
async function removeWishlist(id){try{await api('/api/customer/wishlist/'+id,{method:'DELETE'});wishlist=wishlist.filter(p=>Number(p.id)!==Number(id));showSection('wishlist')}catch(e){alert(e.message)}}async function logout(){try{await fetch('/api/customer/logout',{method:'POST',credentials:'same-origin'})}finally{location.href='index.html'}}document.getElementById('logoutBtn').addEventListener('click',logout);document.querySelectorAll('.side-btn').forEach(b=>b.addEventListener('click',()=>showSection(b.dataset.section)));init();
</script></body></html>
