<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CANVO Admin Dashboard</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f6f8;
      color: #172033;
    }


    /* =========================================
       SIDEBAR
       ========================================= */

    .sidebar {
      position: fixed;

      left: 0;
      top: 0;

      width: 240px;
      height: 100vh;

      background: #07111f;
      color: white;

      padding: 28px 18px;

      z-index: 100;
    }


    .brand {
      text-align: center;
      margin-bottom: 35px;
    }


    .brand h1 {
      color: #d4af37;

      font-size: 30px;

      letter-spacing: 5px;
    }


    .brand p {
      color: #aeb8c5;

      font-size: 11px;

      letter-spacing: 2px;

      margin-top: 5px;
    }


    .nav {
      display: flex;

      flex-direction: column;

      gap: 8px;
    }


    .nav button {
      width: 100%;

      border: none;

      background: transparent;

      color: #c8d0da;

      padding: 13px 15px;

      border-radius: 8px;

      text-align: left;

      font-size: 14px;

      cursor: pointer;
    }


    .nav button:hover,
    .nav button.active {
      background: #16263a;

      color: white;
    }


    .logout-button {
      position: absolute;

      bottom: 25px;

      left: 18px;

      width: calc(100% - 36px);

      padding: 12px;

      border: 1px solid #39495d;

      background: transparent;

      color: #d8dee7;

      border-radius: 8px;

      cursor: pointer;
    }


    .logout-button:hover {
      background: #1b2a3e;
    }


    /* =========================================
       MAIN
       ========================================= */

    .main {
      margin-left: 240px;

      min-height: 100vh;

      padding: 30px;
    }


    .topbar {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 30px;
    }


    .topbar h2 {
      font-size: 28px;

      color: #111827;
    }


    .admin-info {
      text-align: right;
    }


    .admin-name {
      font-weight: 600;

      color: #172033;
    }


    .admin-email {
      font-size: 12px;

      color: #7b8796;

      margin-top: 3px;
    }


    /* =========================================
       STATS
       ========================================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;

      margin-bottom: 30px;
    }


    .stat-card {
      background: white;

      border-radius: 12px;

      padding: 22px;

      box-shadow:
        0 3px 15px
        rgba(0, 0, 0, 0.05);
    }


    .stat-label {
      font-size: 13px;

      color: #7b8796;

      margin-bottom: 10px;
    }


    .stat-value {
      font-size: 30px;

      font-weight: 700;

      color: #111827;
    }


    /* =========================================
       CONTENT CARD
       ========================================= */

    .content-card {
      background: white;

      border-radius: 12px;

      padding: 24px;

      box-shadow:
        0 3px 15px
        rgba(0, 0, 0, 0.05);
    }


    .content-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 20px;
    }


    .content-header h3 {
      font-size: 20px;
    }


    .add-button {
      border: none;

      background: #07111f;

      color: white;

      padding: 11px 18px;

      border-radius: 7px;

      cursor: pointer;

      font-weight: 600;
    }


    .add-button:hover {
      background: #16263a;
    }


    /* =========================================
       TABLE
       ========================================= */

    .table-wrapper {
      width: 100%;

      overflow-x: auto;
    }


    table {
      width: 100%;

      border-collapse: collapse;

      min-width: 850px;
    }


    th {
      text-align: left;

      font-size: 12px;

      color: #7b8796;

      text-transform: uppercase;

      letter-spacing: 0.5px;

      padding: 13px;

      border-bottom:
        1px solid #e5e7eb;
    }


    td {
      padding: 15px 13px;

      border-bottom:
        1px solid #eef0f3;

      font-size: 14px;
    }


    .product-image {
      width: 50px;

      height: 50px;

      object-fit: cover;

      border-radius: 7px;

      background: #f1f3f5;
    }


    .status {
      display: inline-block;

      padding: 5px 9px;

      border-radius: 20px;

      font-size: 11px;

      font-weight: 600;
    }


    .status.active {
      background: #eaf8f0;

      color: #18794e;
    }


    .status.inactive {
      background: #fff0f0;

      color: #b42318;
    }


    .empty {
      text-align: center;

      padding: 50px 20px;

      color: #8a95a3;
    }


    .loading {
      text-align: center;

      padding: 40px;

      color: #7b8796;
    }


    /* =========================================
       ACTION BUTTONS
       ========================================= */

    .action-button {
      border: none;

      padding: 7px 12px;

      border-radius: 6px;

      font-size: 12px;

      font-weight: 600;

      cursor: pointer;

      margin-right: 5px;
    }


    .edit-button {
      background: #16263a;

      color: white;
    }


    .edit-button:hover {
      background: #243b55;
    }


    .delete-button {
      background: #f3d6d6;

      color: #9b1c1c;
    }


    .delete-button:hover {
      background: #e8bcbc;
    }


    /* =========================================
       MODAL
       ========================================= */

    .modal {
      display: none;

      position: fixed;

      inset: 0;

      background:
        rgba(0, 0, 0, 0.55);

      z-index: 1000;

      align-items: center;

      justify-content: center;

      padding: 20px;
    }


    .modal.show {
      display: flex;
    }


    .modal-box {
      width: 100%;

      max-width: 650px;

      max-height: 90vh;

      overflow-y: auto;

      background: white;

      border-radius: 14px;

      padding: 28px;

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.2);
    }


    .modal-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 22px;
    }


    .modal-header h3 {
      font-size: 22px;
    }


    .close-modal {
      border: none;

      background: transparent;

      font-size: 28px;

      cursor: pointer;

      color: #6b7280;
    }


    .form-group {
      margin-bottom: 17px;
    }


    .form-group label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;

      font-weight: 600;

      color: #172033;
    }


    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;

      padding: 12px 13px;

      border: 1px solid #d5dbe3;

      border-radius: 7px;

      font-size: 14px;

      outline: none;
    }


    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #16263a;
    }


    .form-group textarea {
      min-height: 100px;

      resize: vertical;
    }


    .form-row {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 15px;
    }


    .modal-actions {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      margin-top: 22px;
    }


    .cancel-button {
      border: 1px solid #d5dbe3;

      background: white;

      color: #172033;

      padding: 11px 18px;

      border-radius: 7px;

      cursor: pointer;
    }


    .cancel-button:hover {
      background: #f5f6f8;
    }


    .save-button {
      border: none;

      background: #07111f;

      color: white;

      padding: 11px 20px;

      border-radius: 7px;

      cursor: pointer;

      font-weight: 600;
    }


    .save-button:hover {
      background: #16263a;
    }


    .save-button:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }


    .form-message {
      margin-top: 15px;

      padding: 10px 12px;

      border-radius: 7px;

      display: none;

      font-size: 13px;
    }


    .form-message.success {
      display: block;

      background: #eaf8f0;

      color: #18794e;
    }


    .form-message.error {
      display: block;

      background: #fff0f0;

      color: #b42318;
    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 900px) {

      .sidebar {
        width: 200px;
      }

      .main {
        margin-left: 200px;
      }

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 650px) {

      .sidebar {
        position: relative;

        width: 100%;

        height: auto;

        padding: 18px;
      }


      .brand {
        margin-bottom: 15px;
      }


      .nav {
        flex-direction: row;

        overflow-x: auto;
      }


      .nav button {
        white-space: nowrap;
      }


      .logout-button {
        position: static;

        width: 100%;

        margin-top: 15px;
      }


      .main {
        margin-left: 0;

        padding: 18px;
      }


      .topbar {
        align-items: flex-start;

        gap: 15px;

        flex-direction: column;
      }


      .admin-info {
        text-align: left;
      }


      .stats {
        grid-template-columns: 1fr;
      }


      .form-row {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       SIDEBAR
       ========================================= -->

  <aside class="sidebar">

    <div class="brand">

      <h1>CANVO</h1>

      <p>ADMIN PANEL</p>

    </div>


    <nav class="nav">

      <button
        class="active"
        onclick="showSection('dashboard')"
      >
        Dashboard
      </button>


      <button
        onclick="showSection('products')"
      >
        Products
      </button>


      <button
        onclick="showSection('orders')"
      >
        Orders
      </button>


      <button
        onclick="showSection('customers')"
      >
        Customers
      </button>


      <button
        onclick="showSection('stock')"
      >
        Stock
      </button>

    </nav>


    <button
      class="logout-button"
      onclick="logout()"
    >
      Logout
    </button>

  </aside>



  <!-- =========================================
       MAIN
       ========================================= -->

  <main class="main">


    <!-- TOP BAR -->

    <div class="topbar">

      <div>

        <h2>Dashboard</h2>

      </div>


      <div class="admin-info">

        <div
          class="admin-name"
          id="adminName"
        >
          Loading...
        </div>

        <div
          class="admin-email"
          id="adminEmail"
        >
          Loading...
        </div>

      </div>

    </div>



    <!-- =========================================
         STATS
         ========================================= -->

    <section class="stats">


      <div class="stat-card">

        <div class="stat-label">
          Total Products
        </div>

        <div
          class="stat-value"
          id="productCount"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Orders
        </div>

        <div
          class="stat-value"
          id="orderCount"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Customers
        </div>

        <div
          class="stat-value"
          id="customerCount"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Stock Items
        </div>

        <div
          class="stat-value"
          id="stockCount"
        >
          0
        </div>

      </div>


    </section>



    <!-- =========================================
         PRODUCTS
         ========================================= -->

    <section
      class="content-card"
      id="productsSection"
    >


      <div class="content-header">

        <h3>Products</h3>


        <button
          class="add-button"
          onclick="openProductModal()"
        >
          + Add Product
        </button>

      </div>


      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>Image</th>

              <th>Product</th>

              <th>Category</th>

              <th>Price</th>

              <th>Status</th>

              <th>Actions</th>

            </tr>

          </thead>


          <tbody id="productsTable">

            <tr>

              <td
                colspan="6"
                class="loading"
              >
                Loading products...
              </td>

            </tr>

          </tbody>

        </table>

      </div>


    </section>


  </main>



  <!-- =========================================
       ADD / EDIT PRODUCT MODAL
       ========================================= -->

  <div
    class="modal"
    id="productModal"
  >

    <div class="modal-box">


      <div class="modal-header">

        <h3>
          Add New Product
        </h3>


        <button
          class="close-modal"
          onclick="closeProductModal()"
          type="button"
        >
          ×
        </button>

      </div>



      <form id="productForm">


        <!-- PRODUCT NAME -->

        <div class="form-group">

          <label for="productName">
            Product Name *
          </label>

          <input
            type="text"
            id="productName"
            placeholder="Example: Classic Runner"
            required
          >

        </div>



        <!-- CATEGORY + STATUS -->

        <div class="form-row">


          <div class="form-group">

            <label for="productCategory">
              Category *
            </label>


            <select
              id="productCategory"
              required
            >

              <option value="">
                Select category
              </option>

              <option value="Shoes">
                Shoes
              </option>

              <option value="Bags">
                Bags
              </option>

              <option value="Shirts">
                Shirts
              </option>

              <option value="Pants">
                Pants
              </option>

              <option value="Others">
                Others
              </option>

            </select>

          </div>



          <div class="form-group">

            <label for="productStatus">
              Status
            </label>


            <select id="productStatus">

              <option value="active">
                Active
              </option>

              <option value="inactive">
                Inactive
              </option>

            </select>

          </div>


        </div>



        <!-- PRICE + OLD PRICE -->

        <div class="form-row">


          <div class="form-group">

            <label for="productPrice">
              Price (৳) *
            </label>


            <input
              type="number"
              id="productPrice"
              min="0"
              step="0.01"
              placeholder="2490"
              required
            >

          </div>



          <div class="form-group">

            <label for="productOldPrice">
              Old Price (৳)
            </label>


            <input
              type="number"
              id="productOldPrice"
              min="0"
              step="0.01"
              placeholder="2990"
            >

          </div>


        </div>



        <!-- IMAGE -->

        <div class="form-group">

          <label for="productImage">
            Image URL
          </label>


          <input
            type="url"
            id="productImage"
            placeholder="https://example.com/product.jpg"
          >

        </div>



        <!-- DESCRIPTION -->

        <div class="form-group">

          <label for="productDescription">
            Description
          </label>


          <textarea
            id="productDescription"
            placeholder="Write product description..."
          ></textarea>

        </div>



        <!-- MESSAGE -->

        <div
          id="productFormMessage"
          class="form-message"
        ></div>



        <!-- ACTIONS -->

        <div class="modal-actions">


          <button
            type="button"
            class="cancel-button"
            onclick="closeProductModal()"
          >
            Cancel
          </button>


          <button
            type="submit"
            class="save-button"
            id="saveProductButton"
          >
            Save Product
          </button>


        </div>


      </form>


    </div>

  </div>



  <script>


    // =========================================
    // CHECK ADMIN SESSION
    // =========================================

    async function checkAdminSession() {

      try {

        const response =
          await fetch(
            "/api/admin/me",
            {
              method: "GET",
              credentials: "include"
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.authenticated
        ) {

          window.location.href =
            "/admin-login.html";

          return false;

        }


        document
          .getElementById(
            "adminName"
          )
          .textContent =
            data.admin.name;


        document
          .getElementById(
            "adminEmail"
          )
          .textContent =
            data.admin.email;


        return true;


      } catch (error) {

        console.error(error);

        window.location.href =
          "/admin-login.html";

        return false;

      }

    }


// =========================================
// LOAD PRODUCTS
// =========================================

async function loadProducts() {

  const table =
    document.getElementById(
      "productsTable"
    );


  try {

    /*
     * IMPORTANT:
     * Use admin endpoint here so that
     * both active and inactive products
     * are visible in the admin panel.
     */

    const response =
      await fetch(
        "/api/admin/products",
        {
          method: "GET",
          credentials: "include"
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "Unable to load products."
      );

    }


    const products =
      data.products || [];


    /*
     * =========================================
     * COUNT ACTIVE PRODUCTS ONLY
     * =========================================
     *
     * Inactive products remain visible
     * in the admin panel, but they are
     * not counted as active products.
     */

    const activeProducts =
      products.filter(
        product =>
          product.status === "active"
      );


    document
      .getElementById(
        "productCount"
      )
      .textContent =
        activeProducts.length;


    /*
     * =========================================
     * NO PRODUCTS
     * =========================================
     */

    if (
      products.length === 0
    ) {

      table.innerHTML = `

        <tr>

          <td
            colspan="6"
            class="empty"
          >

            No products found.

            <br>

            Add your first product
            from the admin panel.

          </td>

        </tr>

      `;

      return;

    }



    /*
     * =========================================
     * DISPLAY PRODUCTS
     * =========================================
     */

    table.innerHTML =

      products
        .map(
          product => `

            <tr>


              <!-- IMAGE -->

              <td>

                ${
                  product.image_url

                    ? `

                      <img
                        src="${escapeHtml(
                          product.image_url
                        )}"
                        class="product-image"
                        alt="${escapeHtml(
                          product.name
                        )}"
                      >

                    `

                    : `

                      <div
                        class="product-image"
                      ></div>

                    `
                }

              </td>



              <!-- PRODUCT -->

              <td>

                <strong>

                  ${escapeHtml(
                    product.name
                  )}

                </strong>

              </td>



              <!-- CATEGORY -->

              <td>

                ${escapeHtml(
                  product.category
                )}

              </td>



              <!-- PRICE -->

              <td>

                ৳${Number(
                  product.price
                ).toLocaleString()}

              </td>



              <!-- STATUS -->

              <td>

                <span
                  class="status ${
                    product.status ===
                    "active"
                      ? "active"
                      : "inactive"
                  }"
                >

                  ${escapeHtml(
                    product.status
                  )}

                </span>

              </td>



              <!-- ACTIONS -->

              <td>

                <button
                  type="button"
                  class="action-button edit-button"
                  onclick="editProduct(${Number(
                    product.id
                  )})"
                >
                  Edit
                </button>


                <button
                  type="button"
                  class="action-button delete-button"
                  onclick="deleteProduct(${Number(
                    product.id
                  )})"
                >
                  Delete
                </button>

              </td>


            </tr>

          `
        )
        .join("");


  } catch (error) {

    console.error(error);


    table.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty"
        >

          Failed to load products.

        </td>

      </tr>

    `;

  }

}

    // =========================================
    // HTML ESCAPE
    // =========================================

    function escapeHtml(value) {

      return String(value ?? "")

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }



    // =========================================
    // NAVIGATION
    // =========================================

    function showSection(section) {

      if (
        section !==
        "dashboard"
      ) {

        alert(

          section
            .charAt(0)
            .toUpperCase() +

          section.slice(1) +

          " management will be added next."

        );

      }

    }



    // =========================================
    // OPEN ADD PRODUCT MODAL
    // =========================================

    function openProductModal() {

      const modal =
        document.getElementById(
          "productModal"
        );


      const form =
        document.getElementById(
          "productForm"
        );


      const title =
        document.querySelector(
          "#productModal .modal-header h3"
        );


      const button =
        document.getElementById(
          "saveProductButton"
        );


      const message =
        document.getElementById(
          "productFormMessage"
        );


      /*
       * Reset form
       */

      form.reset();


      /*
       * Remove edit mode
       */

      form.removeAttribute(
        "data-product-id"
      );


      /*
       * Set Add mode
       */

      title.textContent =
        "Add New Product";


      button.textContent =
        "Save Product";


      /*
       * Clear message
       */

      message.className =
        "form-message";

      message.textContent =
        "";


      /*
       * Show modal
       */

      modal.classList.add(
        "show"
      );

    }



    // =========================================
    // CLOSE PRODUCT MODAL
    // =========================================

    function closeProductModal() {

      document
        .getElementById(
          "productModal"
        )
        .classList.remove(
          "show"
        );

    }



    // =========================================
    // EDIT PRODUCT
    // =========================================

    async function editProduct(
      productId
    ) {

      try {

        /*
         * Get all products from
         * authenticated admin endpoint.
         */

        const response =
          await fetch(
            "/api/admin/products",
            {
              method: "GET",
              credentials: "include"
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.ok
        ) {

          throw new Error(
            data.error ||
            "Failed to load products."
          );

        }


        /*
         * Find selected product.
         */

        const product =
          (
            data.products || []
          ).find(
            item =>
              Number(item.id) ===
              Number(productId)
          );


        if (!product) {

          alert(
            "Product not found."
          );

          return;

        }


        /*
         * Open modal.
         */

        document
          .getElementById(
            "productModal"
          )
          .classList.add(
            "show"
          );


        /*
         * Fill form.
         */

        document
          .getElementById(
            "productName"
          )
          .value =
            product.name || "";


        document
          .getElementById(
            "productCategory"
          )
          .value =
            product.category || "";


        document
          .getElementById(
            "productPrice"
          )
          .value =
            product.price ?? "";


        document
          .getElementById(
            "productOldPrice"
          )
          .value =
            product.old_price ?? "";


        document
          .getElementById(
            "productImage"
          )
          .value =
            product.image_url || "";


        document
          .getElementById(
            "productDescription"
          )
          .value =
            product.description || "";


        document
          .getElementById(
            "productStatus"
          )
          .value =
            product.status ||
            "active";


        /*
         * Change modal title.
         */

        document
          .querySelector(
            "#productModal .modal-header h3"
          )
          .textContent =
            "Edit Product";


        /*
         * Change button.
         */

        document
          .getElementById(
            "saveProductButton"
          )
          .textContent =
            "Update Product";


        /*
         * Store product ID.
         */

        document
          .getElementById(
            "productForm"
          )
          .dataset.productId =
            productId;


        /*
         * Clear message.
         */

        const message =
          document.getElementById(
            "productFormMessage"
          );

        message.className =
          "form-message";

        message.textContent =
          "";


      } catch (error) {

        console.error(error);


        alert(
          error.message ||
          "Failed to load product."
        );

      }

    }



    // =========================================
    // DELETE PRODUCT
    // =========================================

    async function deleteProduct(
      productId
    ) {

      /*
       * First get product name
       * for confirmation message.
       */

      let productName =
        "this product";


      try {

        const listResponse =
          await fetch(
            "/api/admin/products",
            {
              method: "GET",
              credentials: "include"
            }
          );


        const listData =
          await listResponse.json();


        if (
          listResponse.ok &&
          listData.ok
        ) {

          const product =
            (
              listData.products || []
            ).find(
              item =>
                Number(item.id) ===
                Number(productId)
            );


          if (product) {

            productName =
              product.name;

          }

        }

      } catch (error) {

        console.error(
          "Could not load product name:",
          error
        );

      }


      /*
       * Confirmation.
       */

      const confirmed =
        confirm(
          `Are you sure you want to delete "${productName}"?`
        );


      if (!confirmed) {

        return;

      }


      try {

        const response =
          await fetch(
            `/api/admin/products/${productId}`,
            {
              method: "DELETE",
              credentials: "include"
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.ok
        ) {

          throw new Error(
            data.error ||
            "Failed to delete product."
          );

        }


        alert(
          "Product deleted successfully."
        );


        /*
         * Refresh product table.
         */

        await loadProducts();


      } catch (error) {

        console.error(error);


        alert(
          error.message ||
          "Something went wrong."
        );

      }

    }



    // =========================================
    // CREATE / UPDATE PRODUCT
    // =========================================

    async function createProduct(
      event
    ) {

      event.preventDefault();


      const form =
        document.getElementById(
          "productForm"
        );


      const button =
        document.getElementById(
          "saveProductButton"
        );


      const message =
        document.getElementById(
          "productFormMessage"
        );


      /*
       * Check whether this is
       * Add or Edit mode.
       */

      const productId =
        form.dataset.productId;


      const isEditing =
        Boolean(productId);



      // =======================================
      // GET FORM VALUES
      // =======================================

      const name =
        document
          .getElementById(
            "productName"
          )
          .value
          .trim();


      const category =
        document
          .getElementById(
            "productCategory"
          )
          .value;


      const price =
        Number(
          document
            .getElementById(
              "productPrice"
            )
            .value
        );


      const oldPriceValue =
        document
          .getElementById(
            "productOldPrice"
          )
          .value;


      const old_price =
        oldPriceValue === ""
          ? null
          : Number(
              oldPriceValue
            );


      const image_url =
        document
          .getElementById(
            "productImage"
          )
          .value
          .trim();


      const description =
        document
          .getElementById(
            "productDescription"
          )
          .value
          .trim();


      const status =
        document
          .getElementById(
            "productStatus"
          )
          .value;



      // =======================================
      // VALIDATION
      // =======================================

      if (
        !name ||
        !category
      ) {

        message.className =
          "form-message error";

        message.textContent =
          "Please fill in all required fields.";

        return;

      }


      if (
        !Number.isFinite(price) ||
        price < 0
      ) {

        message.className =
          "form-message error";

        message.textContent =
          "Please enter a valid price.";

        return;

      }


      if (
        old_price !== null &&
        (
          !Number.isFinite(
            old_price
          ) ||
          old_price < 0
        )
      ) {

        message.className =
          "form-message error";

        message.textContent =
          "Please enter a valid old price.";

        return;

      }



      // =======================================
      // DISABLE BUTTON
      // =======================================

      button.disabled =
        true;


      button.textContent =
        isEditing
          ? "Updating..."
          : "Saving...";



      try {


        // =====================================
        // API URL
        // =====================================

        const apiUrl =
          isEditing

            ? `/api/admin/products/${productId}`

            : "/api/admin/products";


        // =====================================
        // HTTP METHOD
        // =====================================

        const method =
          isEditing
            ? "PUT"
            : "POST";


        // =====================================
        // SEND REQUEST
        // =====================================

        const response =
          await fetch(
            apiUrl,
            {

              method,

              credentials:
                "include",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  name,

                  category,

                  price,

                  old_price,

                  image_url,

                  description,

                  status

                })

            }
          );


        const data =
          await response.json();


        // =====================================
        // CHECK RESPONSE
        // =====================================

        if (
          !response.ok ||
          !data.ok
        ) {

          throw new Error(
            data.error ||
            (
              isEditing
                ? "Failed to update product."
                : "Failed to create product."
            )
          );

        }



        // =====================================
        // SUCCESS MESSAGE
        // =====================================

        message.className =
          "form-message success";


        message.textContent =
          isEditing

            ? "Product updated successfully."

            : "Product created successfully.";



        // =====================================
        // REFRESH PRODUCT LIST
        // =====================================

        await loadProducts();



        // =====================================
        // CLOSE MODAL
        // =====================================

        setTimeout(
          () => {

            closeProductModal();

          },
          800
        );


      } catch (error) {

        console.error(error);


        message.className =
          "form-message error";


        message.textContent =
          error.message ||
          "Something went wrong.";


      } finally {

        button.disabled =
          false;


        /*
         * Restore correct button
         * depending on mode.
         */

        button.textContent =
          isEditing

            ? "Update Product"

            : "Save Product";

      }

    }



    // =========================================
    // LOGOUT
    // =========================================

    async function logout() {

      try {

        await fetch(
          "/api/admin/logout",
          {
            method: "POST",

            credentials:
              "include"
          }
        );

      } catch (error) {

        console.error(
          error
        );

      }


      window.location.href =
        "/admin-login.html";

    }



    // =========================================
    // FORM SUBMIT
    // =========================================

    document
      .getElementById(
        "productForm"
      )
      .addEventListener(
        "submit",
        createProduct
      );



    // =========================================
    // INITIALIZE DASHBOARD
    // =========================================

    async function initializeDashboard() {

      const authenticated =
        await checkAdminSession();


      if (
        !authenticated
      ) {

        return;

      }


      await loadProducts();

    }


    initializeDashboard();


  </script>
