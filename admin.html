<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CANVO Admin Dashboard</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f6f8;
      color: #172033;
    }


    /* =========================================
       SIDEBAR
       ========================================= */

    .sidebar {
      position: fixed;

      left: 0;
      top: 0;

      width: 240px;
      height: 100vh;

      background: #07111f;
      color: white;

      padding: 28px 18px;

      z-index: 100;
    }


    .brand {
      text-align: center;
      margin-bottom: 35px;
    }


    .brand h1 {
      color: #d4af37;

      font-size: 30px;

      letter-spacing: 5px;
    }


    .brand p {
      color: #aeb8c5;

      font-size: 11px;

      letter-spacing: 2px;

      margin-top: 5px;
    }


    .nav {
      display: flex;

      flex-direction: column;

      gap: 8px;
    }


    .nav button {
      width: 100%;

      border: none;

      background: transparent;

      color: #c8d0da;

      padding: 13px 15px;

      border-radius: 8px;

      text-align: left;

      font-size: 14px;

      cursor: pointer;
    }


    .nav button:hover,
    .nav button.active {
      background: #16263a;

      color: white;
    }


    .logout-button {
      position: absolute;

      bottom: 25px;

      left: 18px;

      width: calc(100% - 36px);

      padding: 12px;

      border: 1px solid #39495d;

      background: transparent;

      color: #d8dee7;

      border-radius: 8px;

      cursor: pointer;
    }


    .logout-button:hover {
      background: #1b2a3e;
    }


    /* =========================================
       MAIN
       ========================================= */

    .main {
      margin-left: 240px;

      min-height: 100vh;

      padding: 30px;
    }


    .topbar {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 30px;
    }


    .topbar h2 {
      font-size: 28px;

      color: #111827;
    }


    .admin-info {
      text-align: right;
    }


    .admin-name {
      font-weight: 600;

      color: #172033;
    }


    .admin-email {
      font-size: 12px;

      color: #7b8796;

      margin-top: 3px;
    }


    /* =========================================
       CARDS
       ========================================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;

      margin-bottom: 30px;
    }


    .stat-card {
      background: white;

      border-radius: 12px;

      padding: 22px;

      box-shadow:
        0 3px 15px
        rgba(0, 0, 0, 0.05);
    }


    .stat-label {
      font-size: 13px;

      color: #7b8796;

      margin-bottom: 10px;
    }


    .stat-value {
      font-size: 30px;

      font-weight: 700;

      color: #111827;
    }


    /* =========================================
       CONTENT CARD
       ========================================= */

    .content-card {
      background: white;

      border-radius: 12px;

      padding: 24px;

      box-shadow:
        0 3px 15px
        rgba(0, 0, 0, 0.05);
    }


    .content-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 20px;
    }


    .content-header h3 {
      font-size: 20px;
    }


    .add-button {
      border: none;

      background: #07111f;

      color: white;

      padding: 11px 18px;

      border-radius: 7px;

      cursor: pointer;

      font-weight: 600;
    }


    .add-button:hover {
      background: #16263a;
    }


    /* =========================================
       TABLE
       ========================================= */

    .table-wrapper {
      width: 100%;

      overflow-x: auto;
    }


    table {
      width: 100%;

      border-collapse: collapse;

      min-width: 700px;
    }


    th {
      text-align: left;

      font-size: 12px;

      color: #7b8796;

      text-transform: uppercase;

      letter-spacing: 0.5px;

      padding: 13px;

      border-bottom:
        1px solid #e5e7eb;
    }


    td {
      padding: 15px 13px;

      border-bottom:
        1px solid #eef0f3;

      font-size: 14px;
    }


    .product-image {
      width: 50px;

      height: 50px;

      object-fit: cover;

      border-radius: 7px;

      background: #f1f3f5;
    }


    .status {
      display: inline-block;

      padding: 5px 9px;

      border-radius: 20px;

      font-size: 11px;

      font-weight: 600;
    }


    .status.active {
      background: #eaf8f0;

      color: #18794e;
    }


    .status.inactive {
      background: #fff0f0;

      color: #b42318;
    }


    .empty {
      text-align: center;

      padding: 50px 20px;

      color: #8a95a3;
    }


    /* =========================================
       LOADING
       ========================================= */

    .loading {
      text-align: center;

      padding: 40px;

      color: #7b8796;
    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 900px) {

      .sidebar {
        width: 200px;
      }

      .main {
        margin-left: 200px;
      }

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 650px) {

      .sidebar {
        position: relative;

        width: 100%;

        height: auto;

        padding: 18px;
      }


      .brand {
        margin-bottom: 15px;
      }


      .nav {
        flex-direction: row;

        overflow-x: auto;
      }


      .nav button {
        white-space: nowrap;
      }


      .logout-button {
        position: static;

        width: 100%;

        margin-top: 15px;
      }


      .main {
        margin-left: 0;

        padding: 18px;
      }


      .topbar {
        align-items: flex-start;

        gap: 15px;

        flex-direction: column;
      }


      .admin-info {
        text-align: left;
      }


      .stats {
        grid-template-columns: 1fr;
      }

    }
/* =========================================
   ADD PRODUCT MODAL
   ========================================= */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 650px;
  max-height: 90vh;
  overflow-y: auto;
  background: white;
  border-radius: 14px;
  padding: 28px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.modal-header h3 {
  font-size: 22px;
}

.close-modal {
  border: none;
  background: transparent;
  font-size: 28px;
  cursor: pointer;
  color: #6b7280;
}

.form-group {
  margin-bottom: 17px;
}

.form-group label {
  display: block;
  margin-bottom: 7px;
  font-size: 13px;
  font-weight: 600;
  color: #172033;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 12px 13px;
  border: 1px solid #d5dbe3;
  border-radius: 7px;
  font-size: 14px;
  outline: none;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  border-color: #16263a;
}

.form-group textarea {
  min-height: 100px;
  resize: vertical;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 22px;
}

.cancel-button {
  border: 1px solid #d5dbe3;
  background: white;
  color: #172033;
  padding: 11px 18px;
  border-radius: 7px;
  cursor: pointer;
}

.save-button {
  border: none;
  background: #07111f;
  color: white;
  padding: 11px 20px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: 600;
}

.save-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.form-message {
  margin-top: 15px;
  padding: 10px 12px;
  border-radius: 7px;
  display: none;
  font-size: 13px;
}

.form-message.success {
  display: block;
  background: #eaf8f0;
  color: #18794e;
}

.form-message.error {
  display: block;
  background: #fff0f0;
  color: #b42318;
}

@media (max-width: 600px) {
  .form-row {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>


<body>


  <!-- =========================================
       SIDEBAR
       ========================================= -->

  <aside class="sidebar">

    <div class="brand">

      <h1>CANVO</h1>

      <p>ADMIN PANEL</p>

    </div>


    <nav class="nav">

      <button
        class="active"
        onclick="showSection('dashboard')"
      >
        Dashboard
      </button>


      <button
        onclick="showSection('products')"
      >
        Products
      </button>


      <button
        onclick="showSection('orders')"
      >
        Orders
      </button>


      <button
        onclick="showSection('customers')"
      >
        Customers
      </button>


      <button
        onclick="showSection('stock')"
      >
        Stock
      </button>

    </nav>


    <button
      class="logout-button"
      onclick="logout()"
    >
      Logout
    </button>

  </aside>



  <!-- =========================================
       MAIN
       ========================================= -->

  <main class="main">


    <!-- TOP BAR -->

    <div class="topbar">

      <div>

        <h2>Dashboard</h2>

      </div>


      <div class="admin-info">

        <div
          class="admin-name"
          id="adminName"
        >
          Loading...
        </div>

        <div
          class="admin-email"
          id="adminEmail"
        >
          Loading...
        </div>

      </div>

    </div>



    <!-- =========================================
         STATS
         ========================================= -->

    <section class="stats">

      <div class="stat-card">

        <div class="stat-label">
          Total Products
        </div>

        <div
          class="stat-value"
          id="productCount"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Orders
        </div>

        <div
          class="stat-value"
          id="orderCount"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Customers
        </div>

        <div
          class="stat-value"
          id="customerCount"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Stock Items
        </div>

        <div
          class="stat-value"
          id="stockCount"
        >
          0
        </div>

      </div>

    </section>



    <!-- =========================================
         PRODUCTS
         ========================================= -->

    <section
      class="content-card"
      id="productsSection"
    >

      <div class="content-header">

        <h3>Products</h3>

       <button
  class="add-button"
  onclick="openProductModal()"
>
  + Add Product
</button>

      </div>


      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>Image</th>

              <th>Product</th>

              <th>Category</th>

              <th>Price</th>

              <th>Status</th>

            </tr>

          </thead>


          <tbody id="productsTable">

            <tr>

              <td
                colspan="5"
                class="loading"
              >
                Loading products...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>


  </main>
<!-- =========================================
     ADD PRODUCT MODAL
     ========================================= -->

<div class="modal" id="productModal">

  <div class="modal-box">

    <div class="modal-header">
      <h3>Add New Product</h3>

      <button
        class="close-modal"
        onclick="closeProductModal()"
        type="button"
      >
        ×
      </button>
    </div>

    <form id="productForm">

      <div class="form-group">

        <label for="productName">
          Product Name *
        </label>

        <input
          type="text"
          id="productName"
          placeholder="Example: Classic Runner"
          required
        >

      </div>


      <div class="form-row">

        <div class="form-group">

          <label for="productCategory">
            Category *
          </label>

          <select id="productCategory" required>

            <option value="">
              Select category
            </option>

            <option value="Shoes">
              Shoes
            </option>

            <option value="Bags">
              Bags
            </option>

            <option value="Shirts">
              Shirts
            </option>

            <option value="Pants">
              Pants
            </option>

            <option value="Others">
              Others
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="productStatus">
            Status
          </label>

          <select id="productStatus">

            <option value="active">
              Active
            </option>

            <option value="inactive">
              Inactive
            </option>

          </select>

        </div>

      </div>


      <div class="form-row">

        <div class="form-group">

          <label for="productPrice">
            Price (৳) *
          </label>

          <input
            type="number"
            id="productPrice"
            min="0"
            step="0.01"
            placeholder="2490"
            required
          >

        </div>


        <div class="form-group">

          <label for="productOldPrice">
            Old Price (৳)
          </label>

          <input
            type="number"
            id="productOldPrice"
            min="0"
            step="0.01"
            placeholder="2990"
          >

        </div>

      </div>


      <div class="form-group">

        <label for="productImage">
          Image URL
        </label>

        <input
          type="url"
          id="productImage"
          placeholder="https://example.com/product.jpg"
        >

      </div>


      <div class="form-group">

        <label for="productDescription">
          Description
        </label>

        <textarea
          id="productDescription"
          placeholder="Write product description..."
        ></textarea>

      </div>


      <div
        id="productFormMessage"
        class="form-message"
      ></div>


      <div class="modal-actions">

        <button
          type="button"
          class="cancel-button"
          onclick="closeProductModal()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="save-button"
          id="saveProductButton"
        >
          Save Product
        </button>

      </div>

    </form>

  </div>

</div>


  <script>


    // =========================================
    // CHECK ADMIN SESSION
    // =========================================

    async function checkAdminSession() {

      try {

        const response =
          await fetch(
            "/api/admin/me",
            {
              method: "GET",
              credentials: "include"
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.authenticated
        ) {

          window.location.href =
            "/admin-login.html";

          return false;

        }


        document.getElementById(
          "adminName"
        ).textContent =
          data.admin.name;


        document.getElementById(
          "adminEmail"
        ).textContent =
          data.admin.email;


        return true;


      } catch (error) {

        window.location.href =
          "/admin-login.html";

        return false;

      }

    }



    // =========================================
    // LOAD PRODUCTS
    // =========================================

    async function loadProducts() {

      const table =
        document.getElementById(
          "productsTable"
        );


      try {

        const response =
          await fetch(
            "/api/products",
            {
              method: "GET"
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.ok
        ) {

          throw new Error(
            data.error ||
            "Unable to load products."
          );

        }


        const products =
          data.products || [];


        document.getElementById(
          "productCount"
        ).textContent =
          products.length;


        if (products.length === 0) {

          table.innerHTML = `
            <tr>
              <td
                colspan="5"
                class="empty"
              >
                No products found.
                <br>
                Add your first product
                from the admin panel.
              </td>
            </tr>
          `;

          return;

        }


        table.innerHTML =
          products.map(
            product => `

              <tr>

                <td>

                  ${
                    product.image_url

                      ? `
                        <img
                          src="${escapeHtml(
                            product.image_url
                          )}"
                          class="product-image"
                          alt="${escapeHtml(
                            product.name
                          )}"
                        >
                      `

                      : `
                        <div
                          class="product-image"
                        ></div>
                      `
                  }

                </td>


                <td>

                  <strong>
                    ${escapeHtml(
                      product.name
                    )}
                  </strong>

                </td>


                <td>
                  ${escapeHtml(
                    product.category
                  )}
                </td>


                <td>
                  ৳${Number(
                    product.price
                  ).toLocaleString()}
                </td>


                <td>

                  <span
                    class="status ${
                      product.status ===
                      "active"
                        ? "active"
                        : "inactive"
                    }"
                  >

                    ${escapeHtml(
                      product.status
                    )}

                  </span>

                </td>

              </tr>

            `
          )
          .join("");


      } catch (error) {

        table.innerHTML = `
          <tr>
            <td
              colspan="5"
              class="empty"
            >
              Failed to load products.
            </td>
          </tr>
        `;

        console.error(error);

      }

    }



    // =========================================
    // HTML ESCAPE
    // =========================================

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }



    // =========================================
    // NAVIGATION
    // =========================================

    function showSection(section) {

      if (section !== "dashboard") {

        alert(
          section.charAt(0).toUpperCase() +
          section.slice(1) +
          " management will be added next."
        );

      }

    }


// =========================================
// ADD PRODUCT
// =========================================

function openProductModal() {

  document
    .getElementById("productModal")
    .classList.add("show");

  document
    .getElementById("productForm")
    .reset();

  const message =
    document.getElementById("productFormMessage");

  message.className = "form-message";
  message.textContent = "";

}


function closeProductModal() {

  document
    .getElementById("productModal")
    .classList.remove("show");

}


async function createProduct(event) {

  event.preventDefault();

  const button =
    document.getElementById("saveProductButton");

  const message =
    document.getElementById("productFormMessage");


  const name =
    document
      .getElementById("productName")
      .value
      .trim();

  const category =
    document
      .getElementById("productCategory")
      .value;

  const price =
    Number(
      document
        .getElementById("productPrice")
        .value
    );

  const oldPriceValue =
    document
      .getElementById("productOldPrice")
      .value;

  const old_price =
    oldPriceValue === ""
      ? null
      : Number(oldPriceValue);

  const image_url =
    document
      .getElementById("productImage")
      .value
      .trim();

  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();

  const status =
    document
      .getElementById("productStatus")
      .value;


  if (!name || !category || !price) {

    message.className =
      "form-message error";

    message.textContent =
      "Please fill in all required fields.";

    return;
  }


  button.disabled = true;
  button.textContent = "Saving...";


  try {

    const response = await fetch(
      "/api/admin/products",
      {
        method: "POST",

        credentials: "include",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          name,
          category,
          price,
          old_price,
          image_url,
          description,
          status

        })
      }
    );


    const data =
      await response.json();


    if (!response.ok || !data.ok) {

      throw new Error(
        data.error ||
        "Failed to create product."
      );

    }


    message.className =
      "form-message success";

    message.textContent =
      "Product created successfully.";


    await loadProducts();


    setTimeout(() => {

      closeProductModal();

    }, 800);


  } catch (error) {

    console.error(error);

    message.className =
      "form-message error";

    message.textContent =
      error.message ||
      "Something went wrong.";

  } finally {

    button.disabled = false;
    button.textContent = "Save Product";

  }

}
   


    // =========================================
    // LOGOUT
    // =========================================

    async function logout() {

      try {

        await fetch(
          "/api/admin/logout",
          {
            method: "POST",
            credentials: "include"
          }
        );

      } catch (error) {

        console.error(error);

      }


      window.location.href =
        "/admin-login.html";

    }



    // =========================================
    // INITIALIZE DASHBOARD
    // =========================================

    async function initializeDashboard() {

      const authenticated =
        await checkAdminSession();


      if (!authenticated) {
        return;
      }


      await loadProducts();

    }
document
  .getElementById("productForm")
  .addEventListener(
    "submit",
    createProduct
  );


    initializeDashboard();

  </script>


</body>
</html>
