<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer Login | CANVO</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#399f7a;--navy:#10132b;--muted:#667085;--line:#d9dee7}*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:var(--navy);font-family:Montserrat,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.auth-shell{width:min(960px,100%);min-height:500px;background:#fff;border-radius:14px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 18px 48px #10132b20}.welcome{background:var(--green);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:44px}.welcome h1{font-size:30px;margin:0 0 14px}.welcome p{font-size:16px;line-height:1.7;max-width:310px}.auth-form-wrap{padding:44px;display:flex;flex-direction:column;justify-content:center}.brand{display:block;text-align:center;margin-bottom:18px}.brand img{width:76px;height:66px;object-fit:contain}.auth-form-wrap h2{text-align:center;font-size:28px;margin:0 0 26px}.tabs{display:flex;background:#f3f5f7;padding:4px;border-radius:8px;margin-bottom:22px}.tabs button{flex:1;border:0;background:transparent;padding:11px;border-radius:6px;font:600 13px inherit;cursor:pointer;color:#566}.tabs button.active{background:#fff;color:var(--green);box-shadow:0 1px 4px #0001}.field{display:block;margin:0 0 16px;font-size:13px;font-weight:600}.field input{display:block;width:100%;margin-top:7px;padding:13px 14px;border:1px solid var(--line);border-radius:7px;font:14px inherit;outline-color:var(--green)}.submit{width:100%;border:0;border-radius:7px;background:var(--green);color:white;padding:14px;font:700 14px Montserrat,Arial;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.message{min-height:20px;margin:12px 0 0;color:#b42318;font-size:13px;line-height:1.5}.back{display:block;text-align:center;margin-top:20px;color:var(--green);font-size:13px;text-decoration:none;font-weight:600}@media(max-width:700px){body{padding:12px}.auth-shell{grid-template-columns:1fr}.welcome{padding:25px 20px}.welcome h1{font-size:23px}.welcome p{margin:0}.auth-form-wrap{padding:28px 22px}.brand{display:none}}
</style></head><body><main class="auth-shell"><section class="welcome"><h1 id="welcomeTitle">Welcome Back!</h1><p id="welcomeText">Log in to continue your shopping journey and explore amazing products.</p></section><section class="auth-form-wrap"><a class="brand" href="index.html"><img src="images/logo.png" alt="CANVO"></a><div class="tabs"><button id="loginTab" class="active" type="button">Login</button><button id="signupTab" type="button">Sign Up</button></div><h2 id="formTitle">Login</h2>
<form id="loginForm"><label class="field">Phone Number<input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="017XXXXXXXX" required pattern="[0-9+() -]{10,18}"></label><label class="field">Password<input name="password" type="password" autocomplete="current-password" required minlength="8"></label><button class="submit" type="submit">Login</button></form>
<form id="signupForm" hidden><label class="field">Full Name<input name="name" autocomplete="name" required minlength="2" maxlength="100" placeholder="Your full name"></label><label class="field">Phone Number<input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="017XXXXXXXX" required pattern="[0-9+() -]{10,18}"></label><label class="field">Password<input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="At least 8 characters"></label><label class="field">Confirm Password<input name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label><button class="submit" type="submit">Create Account</button></form><p id="message" class="message" role="status"></p><a class="back" href="index.html">← Back to CANVO Store</a></section></main>
<script>
const loginForm=document.getElementById('loginForm'),signupForm=document.getElementById('signupForm'),message=document.getElementById('message');
const params=new URLSearchParams(location.search);const requested=params.get('returnTo')||'account.html';
const safeReturn=(()=>{try{const u=new URL(requested,location.origin);return u.origin===location.origin && !u.pathname.startsWith('/api/') ? u.pathname.replace(/^\//,'')+u.search+u.hash : 'account.html'}catch{return 'account.html'}})();
function showMode(mode){const signup=mode==='signup';loginForm.hidden=signup;signupForm.hidden=!signup;document.getElementById('loginTab').classList.toggle('active',!signup);document.getElementById('signupTab').classList.toggle('active',signup);document.getElementById('formTitle').textContent=signup?'Create your account':'Login';document.getElementById('welcomeTitle').textContent=signup?'Join CANVO!':'Welcome Back!';document.getElementById('welcomeText').textContent=signup?'Create your account to track orders, save favourites and shop with confidence.':'Log in to continue your shopping journey and explore amazing products.';message.textContent=''}
document.getElementById('loginTab').addEventListener('click',()=>showMode('login'));document.getElementById('signupTab').addEventListener('click',()=>showMode('signup'));
async function submitAuth(form,endpoint){const button=form.querySelector('button[type=submit]');button.disabled=true;message.style.color='#b42318';message.textContent='Please wait…';try{const data=Object.fromEntries(new FormData(form).entries());if(endpoint.endsWith('register')&&data.password!==data.confirmPassword)throw new Error('Passwords do not match.');delete data.confirmPassword;const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(data)});const result=await res.json();if(!res.ok||!result.ok)throw new Error(result.error||'Something went wrong.');message.style.color='#16835f';message.textContent='Success! Redirecting…';location.href=safeReturn;}catch(e){message.textContent=e.message||'Unable to continue. Please try again.'}finally{button.disabled=false}}
loginForm.addEventListener('submit',e=>{e.preventDefault();submitAuth(loginForm,'/api/customer/login')});signupForm.addEventListener('submit',e=>{e.preventDefault();submitAuth(signupForm,'/api/customer/register')});
fetch('/api/customer/me',{credentials:'same-origin',cache:'no-store'}).then(r=>{if(r.ok)location.href=safeReturn}).catch(()=>{});
</script></body></html>
