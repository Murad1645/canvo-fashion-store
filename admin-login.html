<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CANVO Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #d4af37;
      font-size: 34px;
      letter-spacing: 5px;
    }

    .logo p {
      color: #aeb8c5;
      font-size: 12px;
      letter-spacing: 2px;
      margin-top: 6px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .login-card h2 {
      color: #07111f;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .login-card .subtitle {
      color: #697586;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #273444;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d7dce2;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    .form-group input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
    }

    .login-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #07111f;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-button:hover {
      background: #12243a;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #b42318;
      border: 1px solid #f5c2c0;
    }

    .message.success {
      display: block;
      background: #effaf3;
      color: #16794c;
      border: 1px solid #b7e4c7;
    }

    .footer-text {
      text-align: center;
      color: #8d99a8;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">
      <h1>CANVO</h1>
      <p>ADMIN PANEL</p>
    </div>

    <div class="login-card">

      <h2>Admin Login</h2>

      <p class="subtitle">
        Sign in to manage your CANVO store.
      </p>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Admin email"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Admin password"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          Login
        </button>

      </form>

    </div>

    <div class="footer-text">
      © 2026 CANVO. Admin access only.
    </div>

  </div>


  <script>

    const form =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        showMessage("", "");

        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";


        try {

          const response =
            await fetch(
              "/api/admin/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                  email:
                    emailInput.value.trim(),

                  password:
                    passwordInput.value
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok || !data.ok) {

            showMessage(
              data.error ||
              "Login failed.",
              "error"
            );

            return;
          }


          showMessage(
            "Login successful. Redirecting...",
            "success"
          );


          setTimeout(
            function() {

              window.location.href =
                "/admin.html";

            },
            700
          );


        } catch (error) {

          showMessage(
            "Unable to connect to the server.",
            "error"
          );

        } finally {

          loginButton.disabled = false;

          loginButton.textContent =
            "Login";

        }

      }
    );

  </script>

</body>
</html>
